<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>Moonleaf Garden side plan</title><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#17292F" stroke="#17292F"/><text x="56" y="65" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#F3E7CF">Moonleaf Garden / side plan</text><text x="56" y="104" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#82D9CE">LOOKING ALONG +X · Z = DEPTH · Y = HEIGHT · HINGE AXIS POINTS INTO VIEW</text><rect x="545.1" y="760" width="437.0" height="43.75" rx="5" fill="#F3E7CF" stroke="#78938e"/><rect x="701.5" y="760" width="124.2" height="38.5" rx="5" fill="#B77950" stroke="#78938e"/><rect x="504.85" y="917.5" width="517.5" height="38.5" rx="5" fill="#4D9B91" stroke="#78938e"/><circle cx="414.0" cy="235" r="8" fill="#F0B49A"/><text x="259.0" y="207" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#F3E7CF">HINGE (Y 3.00, Z -1.20)</text><path d="M414.0 235 L807.9596525630725 280.82963250798923" stroke="#AABCB6" stroke-width="2" fill="none" stroke-dasharray="8 5"/><rect x="745.8596525630725" y="261.57963250798923" width="124.2" height="38.5" rx="5" fill="#AABCB6" stroke="#78938e"/><text x="1110" y="265" font-family="Arial,sans-serif" font-size="19" font-weight="500" fill="#AABCB6">1: -37.5° offset</text><text x="1110" y="290" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#AABCB6">Z error +0.19 m</text><path d="M414.0 235 L763.6 380.58695855055146" stroke="#82D9CE" stroke-width="2" fill="none"/><rect x="701.5" y="361.33695855055146" width="124.2" height="38.5" rx="5" fill="#82D9CE" stroke="#78938e"/><text x="1110" y="329" font-family="Arial,sans-serif" font-size="19" font-weight="500" fill="#82D9CE">2: -17.5° offset</text><text x="1110" y="354" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#82D9CE">Z error +0.00 m</text><path d="M763.6 380.58695855055146 L763.6 760" stroke="#82D9CE" stroke-width="2" fill="none" stroke-dasharray="4 5"/><path d="M414.0 235 L677.0734278904348 462.784348757245" stroke="#E7BC76" stroke-width="2" fill="none" stroke-dasharray="8 5"/><rect x="614.9734278904348" y="443.534348757245" width="124.2" height="38.5" rx="5" fill="#E7BC76" stroke="#78938e"/><text x="1110" y="393" font-family="Arial,sans-serif" font-size="19" font-weight="500" fill="#E7BC76">3: +2.5° offset</text><text x="1110" y="418" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#E7BC76">Z error -0.38 m</text><text x="1080" y="570" font-family="Arial,sans-serif" font-size="19" font-weight="500" fill="#F3E7CF">Fold changes depth + height.</text><text x="1080" y="606" font-family="Arial,sans-serif" font-size="19" font-weight="500" fill="#F3E7CF">Settle, then tap Release.</text><text x="1080" y="642" font-family="Arial,sans-serif" font-size="19" font-weight="500" fill="#F3E7CF">Gate follows the chute.</text><text x="1080" y="780" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#F3E7CF">DECK Y = 0 / SEATED BEAM</text><text x="1080" y="936" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#F3E7CF">RECOVERY TRAY</text><text x="80" y="985" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#F3E7CF">Both named supports overlap in this side view. The lower beam reference is seated, not a landing animation.</text><text x="80" y="1027" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#82D9CE">Offsets are Blender design rotations. They are not absolute Duo hinge angles or guaranteed physical outcomes.</text></svg>