<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>Starlight Terrace top plan</title><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#17292F" stroke="#17292F"/><text x="56" y="65" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#F3E7CF">Starlight Terrace / top plan</text><text x="56" y="104" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#82D9CE">METERS · X = ROUTE · Z = DEPTH · DESIGN GEOMETRY, NOT PHYSICS PROOF</text><rect x="300.5" y="184.00000000000006" width="979.0" height="616.0" rx="5" fill="#203d43" stroke="#78938e"/><rect x="350.0" y="444.7" width="319.0" height="209.0" rx="5" fill="#F3E7CF" stroke="#78938e"/><rect x="911.0" y="444.7" width="319.0" height="209.0" rx="5" fill="#F3E7CF" stroke="#78938e"/><rect x="628.3000057697296" y="492.0" width="63.8" height="114.4" rx="5" fill="#6F9D83" stroke="#78938e"/><rect x="887.8999942302704" y="492.0" width="63.8" height="114.4" rx="5" fill="#6F9D83" stroke="#78938e"/><rect x="627.2" y="514.0" width="41.8" height="70.4" rx="5" fill="#243449" stroke="#78938e"/><rect x="911.0" y="514.0" width="41.8" height="70.4" rx="5" fill="#243449" stroke="#78938e"/><rect x="630.5" y="519.5" width="319.0" height="59.400000000000006" rx="5" fill="#B77950" stroke="#78938e"/><path d="M350 549.2 L1230 549.2" stroke="#82D9CE" stroke-width="2" fill="none" stroke-dasharray="8 6"/><path d="M592.0 448.0 L988.0 448.0" stroke="#F0B49A" stroke-width="2" fill="none"/><circle cx="421.5000104904175" cy="549.1999998688698" r="6" fill="#82D9CE"/><path d="M421.5000104904175 549.1999998688698 L386.5000104904175 689.1999998688698" stroke="#82D9CE" stroke-width="2" fill="none"/><text x="356.5000104904175" y="709.1999998688698" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#F3E7CF">START</text><circle cx="1152.9999947547913" cy="549.1999998688698" r="6" fill="#82D9CE"/><path d="M1152.9999947547913 549.1999998688698 L1142.9999947547913 689.1999998688698" stroke="#82D9CE" stroke-width="2" fill="none"/><text x="1112.9999947547913" y="709.1999998688698" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#F3E7CF">GOAL</text><circle cx="660.2000057697296" cy="549.1999998688698" r="6" fill="#82D9CE"/><path d="M660.2000057697296 549.1999998688698 L590.2000057697296 653.1999998688698" stroke="#82D9CE" stroke-width="2" fill="none"/><text x="560.2000057697296" y="673.1999998688698" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#F3E7CF">LEFT SUPPORT</text><circle cx="919.7999942302704" cy="549.1999998688698" r="6" fill="#82D9CE"/><path d="M919.7999942302704 549.1999998688698 L954.7999942302704 653.1999998688698" stroke="#82D9CE" stroke-width="2" fill="none"/><text x="924.7999942302704" y="673.1999998688698" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#F3E7CF">RIGHT SUPPORT</text><circle cx="790.0" cy="447.99999475479126" r="6" fill="#82D9CE"/><path d="M790.0 447.99999475479126 L755.0 399.99999475479126" stroke="#82D9CE" stroke-width="2" fill="none"/><text x="725.0" y="419.99999475479126" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#F3E7CF">HINGE X</text><rect x="429.2" y="460.1" width="61.60000000000001" height="39.6" rx="5" fill="#4D9B91" stroke="#78938e"/><text x="440" y="483.9" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#F3E7CF">CURB</text><text x="400" y="825" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#F3E7CF">UPPER CHUTE / RELEASE GATE: above route; see side plan.</text><text x="80" y="870" font-family="Arial,sans-serif" font-size="21" font-weight="500" fill="#F3E7CF">Route Z = -0.28 m. Both decks, supports, beam and goal use the same route offset.</text><text x="80" y="914" font-family="Arial,sans-serif" font-size="20" font-weight="500" fill="#F3E7CF">2.90 m beam · 0.54 m deck depth · 2.96 m pocket opening · 30 mm end clearance</text><text x="80" y="956" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#F3E7CF">Tray below the gap. Optional curb sits off the main walking lane. Backdrop is non-walkable scenery.</text><text x="80" y="1025" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#82D9CE">Native exports contain named anchors and separate collision proposals. Calibrate the hinge in the event app.</text></svg>